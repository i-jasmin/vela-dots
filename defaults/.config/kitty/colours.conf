color11 #ddb45c
color12 #86a9e8
color13 #bd93e0
color14 #6fc9d4
color15 #e0e4db

# starship and friends reach for the high grey slots for subtle accents;
# pointing them at the palette keeps a prompt on-theme.
color255 #9dd49e
color254 #1e5027
color253 #b8ccb5
color252 #3a4b3a
color251 #a1ced6
color250 #1f4d54
