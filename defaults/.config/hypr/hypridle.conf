# hypridle -- idle timers
#
# Started from conf/autostart.lua. Reload with `pkill hypridle; hypridle &`.
# The four timeouts at the bottom are also set from Settings > Lock screen.
#
# The lock screen is vela's own, a Quickshell WlSessionLock, reached over IPC.
# If the shell is not running the IPC call exits 255 (verified) and hyprlock
# takes over, so an idle laptop still locks even if the shell died. Note the
# gap: when the shell IS running but has no `lock` handler, qs prints "Target
# not found" and still exits 0, so nothing locks -- the handler existing is
# what makes this safe, and `qs -c vela ipc show` is how you check.
# The `pidof` guard keeps a second locker from stacking on top of the first.
$lock = pidof hyprlock >/dev/null || qs -c vela ipc call lock lock || hyprlock

# systemd will take the machine down at this timeout; `|| loginctl suspend`
# covers a session where systemd-logind is not the seat manager.
$suspend = systemctl suspend || loginctl suspend

# Screen power. Hyprland runs the Lua config manager, under which
# `hyprctl dispatch` evaluates its argument as Lua: the old `dispatch dpms off`
# is a Lua syntax error and does nothing (see docs/hyprland-notes.md).
$screenOff = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
$screenOn = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

general {
    lock_cmd = $lock
    # loginctl lock-session is the canonical "lock now" signal: it is what
    # this file, the SUPER+L bind and anything else on the system agree on,
    # and it comes back here as lock_cmd.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $screenOn
    # Hold off the suspend until the session is actually locked (3 is a
    # mode, not seconds: wait for Hyprland to report the lock) so the locker
    # is on screen before the display sleeps -- otherwise the desktop
    # flashes on wake.
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# ---- timeouts ---------------------------------------------------------------
#
# Settings > Lock screen rewrites everything between the two `vela:` lines
# below and restarts hypridle, which does not reload a changed file by itself.
# By hand works too: change a timeout (seconds), delete a listener for
# "never", and restart with `pkill hypridle; hypridle &`. Keep each listener's
# on-timeout as it is -- that is how the settings page tells the four apart.
#
# vela: timeouts begin

# Dim the backlight as a warning. -s saves the current level so -r can put it
# back exactly, including if you were already at 5%.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off. Separate from the lock so the lock screen is already up behind
# it when the panel comes back.
listener {
    timeout = 330
    on-timeout = $screenOff
    on-resume = $screenOn
}

# Suspend.
listener {
    timeout = 1800
    on-timeout = $suspend
}

# vela: timeouts end
