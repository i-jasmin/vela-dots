# kitty
#
# Colours are not here: colours.conf is generated by matugen from the current
# wallpaper (see ~/.config/vela/matugen.toml) and included at the bottom.
# kitty reads it at startup, so a new window picks up a retint; running
# windows are sent `kitty @ set-colors` by `vela retint` (see listen_on below).

# ------------------------------------------------------------------ fonts --
# The Nerd Font build carries the powerline and icon glyphs starship draws.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Ligature-free inside the cursor cell, so you can always see where you are.
disable_ligatures cursor

# No symbol_map here, deliberately.
#
# JetBrainsMono Nerd Font is already the main font and carries the whole Nerd
# Font range, so mapping the private use area to it achieves nothing. Mapping
# U+2600-U+27BF to an emoji font is actively harmful: that block holds
# dingbats and ornaments, not just emoji, and a symbol_map suppresses kitty's
# normal font fallback -- so every codepoint the mapped font lacks renders as
# a blank box instead of being found elsewhere.
#
# That silently broke U+276F (the shell prompt), U+273B/U+273D (spinners) and
# U+2713/U+2717 (check and cross). Without the mapping, kitty falls back per
# codepoint and all of them render.
modify_font underline_position 2
modify_font underline_thickness 1.5

# Glyphs the main font lacks: emoji, then the shell's icon font.

# ----------------------------------------------------------------- window --
window_padding_width 12
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size  no
initial_window_width  110c
initial_window_height 30c

# Opaque. The shell's own transparency is a separate setting in
# ~/.config/vela/config.json; a translucent terminal over a blurred layer is
# one blur too many.
background_opacity 1.0
dynamic_background_opacity yes

# ---------------------------------------------------------------- cursor ---
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0
cursor_trail           3
cursor_trail_decay     0.1 0.4

# --------------------------------------------------------------- scroll ----
scrollback_lines       10000
scrollback_pager_history_size 64
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# ------------------------------------------------------------------ tabs ---
tab_bar_edge      top
tab_bar_style     powerline
tab_powerline_style slanted
tab_bar_min_tabs  2
tab_title_template "{index}  {title}"

# ------------------------------------------------------------------ bell ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# ------------------------------------------------------------------ misc ---
shell_integration enabled
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 0
clipboard_control write-clipboard write-primary read-clipboard read-primary
strip_trailing_spaces smart
# kitty opens fish, set up by ~/.config/fish/config.fish. The login shell
# stays whatever /etc/passwd says -- bash, on a stock Fedora -- so a console
# or an SSH session is still bash, and a working shell is there if fish is
# ever not. Comment this out and kitty opens the login shell instead.
shell fish

# ------------------------------------------------------------------ keys ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ctrl+c copies when there is a selection and sends SIGINT when there is not,
# so the familiar shortcut works without losing the ability to kill a command.
map ctrl+c copy_or_interrupt

# ctrl+v is deliberately NOT mapped. kitty swallows a mapped key before the
# running program sees it, and terminal applications use ctrl+v themselves --
# some paste images with it, and it is the literal-next-character key in
# readline and vim. Pasting is ctrl+shift+v.

# Middle click pastes the primary selection (X11 habit, still useful here).
map shift+insert paste_from_selection
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+shift+f5 load_config_file
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Generated palette. Keep this last so it wins over anything above.
include colours.conf
