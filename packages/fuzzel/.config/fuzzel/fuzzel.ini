# fuzzel
#
# The shell has its own launcher (SUPER+SPACE). This is the one that still
# works when the shell does not -- SUPER+SHIFT+SPACE. Kept visually close to
# the shell so it does not feel like a different machine.
#
# Colours are in colours.ini, generated by matugen from the wallpaper.

# Generated palette. `include` only works here in the top section -- inside a
# [section] fuzzel reads it as a key of that section and errors -- and the
# path must be absolute or start with ~; $HOME is not expanded.
include=~/.config/fuzzel/colours.ini

font=Rubik:size=12
dpi-aware=no
prompt="  "
placeholder=Search
terminal=kitty -e
layer=overlay
exit-on-keyboard-focus-loss=yes

lines=8
width=42
tabs=4
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=22
letter-spacing=0

icon-theme=Adwaita
icons-enabled=yes
image-size-ratio=0.4
fields=name,generic,comment,categories,filename,keywords
match-mode=fzf
sort-result=yes
match-counter=no
show-actions=no

[border]
width=2
radius=16

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
next=Down Control+n
prev=Up Control+p
cancel=Escape Control+c Control+bracketleft
