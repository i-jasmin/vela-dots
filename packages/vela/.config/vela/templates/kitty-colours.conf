# Generated by matugen -- edits are overwritten on the next `vela wallpaper`.
# Source template: ~/.config/vela/templates/kitty-colours.conf
#
# Included from kitty.conf, which keeps the font and layout settings.
#
# Chrome (background, text, cursor, selection, tabs, borders) is retinted from
# the wallpaper. The six ANSI hues are NOT: a shell paints errors red, `ls`
# paints directories blue and git paints diffs red/green, and a palette
# extracted from a wallpaper happily makes "green" pink. They are fixed at
# mid-tones that stay legible on both a light and a dark surface, normal
# (1-6) a step darker than bright (9-14) as the convention expects.
#
# The exceptions that do follow the wallpaper: red is the Material error role,
# which means exactly the same thing, and the four greys are the palette's own
# surface/outline/on-surface tones so the ramp sits on the background. In a
# light palette that makes colour0 a light grey -- it is the dim tone, not
# "black" -- which is the usual compromise for a light terminal theme.

background            {{colors.background.default.hex}}
foreground            {{colors.on_surface.default.hex}}

cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

selection_background  {{colors.secondary_container.default.hex}}
selection_foreground  {{colors.on_secondary_container.default.hex}}

url_color             {{colors.tertiary.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
bell_border_color     {{colors.error.default.hex}}

active_tab_background   {{colors.primary_container.default.hex}}
active_tab_foreground   {{colors.on_primary_container.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
tab_bar_background      {{colors.surface_container_low.default.hex}}

# normal
color0  {{colors.surface_container_high.default.hex}}
color1  {{colors.error.default.hex}}
color2  #4c9a5a
color3  #b1852a
color4  #4a73c4
color5  #8f5bbf
color6  #3f9ba6
color7  {{colors.on_surface_variant.default.hex}}

# bright
color8  {{colors.outline.default.hex}}
color9  {{colors.error.default.hex}}
color10 #7fc48c
color11 #ddb45c
color12 #86a9e8
color13 #bd93e0
color14 #6fc9d4
color15 {{colors.on_surface.default.hex}}

# starship and friends reach for the high grey slots for subtle accents;
# pointing them at the palette keeps a prompt on-theme.
color255 {{colors.primary.default.hex}}
color254 {{colors.primary_container.default.hex}}
color253 {{colors.secondary.default.hex}}
color252 {{colors.secondary_container.default.hex}}
color251 {{colors.tertiary.default.hex}}
color250 {{colors.tertiary_container.default.hex}}
# ...and the greeting (fastfetch.jsonc) draws its separator line in this one.
color249 {{colors.outline_variant.default.hex}}
