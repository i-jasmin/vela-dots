# Generated by matugen -- edits are overwritten on the next `vela wallpaper`.
# Source template: ~/.config/vela/templates/cava.ini
#
# cava in the terminal, in the wallpaper's palette: the bars rise from the
# primary container, deep in a dark palette, through the primary role to the
# tertiary one at their tips -- the two accents Material pairs.
# The background is left to the terminal, which is already the palette's
# surface. A running cava is sent SIGUSR2 on every retint and recolours in
# place.
#
# cava has no include, so this owns the whole of ~/.config/cava/config. The
# shell's own waveform runs a separate cava with its own config and is not
# affected by anything here.

[general]
framerate = 60
autosens = 1
bars = 0
bar_width = 2
bar_spacing = 1

# No [input]: cava picks the best source its own build has. Fedora's is built
# without PipeWire input, and `method = pipewire` stopped it starting with
# "Error loading config"; its default, PulseAudio, reaches PipeWire through
# pipewire-pulse anyway.

[output]
method = ncurses

[color]
background = default
foreground = '{{colors.primary.default.hex}}'
gradient = 1
gradient_count = 3
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.tertiary.default.hex}}'

[smoothing]
monstercat = 1
noise_reduction = 70
