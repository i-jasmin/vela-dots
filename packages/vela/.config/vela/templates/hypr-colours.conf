# Generated by matugen from the current wallpaper -- edits are overwritten on
# the next `vela wallpaper`. Source template:
#   ~/.config/vela/templates/hypr-colours.conf
#
# For hyprlock only. Hyprland itself uses the Lua config and gets its colours
# from hypr-colours.lua; hyprlock is a separate hyprlang binary that cannot
# read Lua, so it keeps this variables-only file.
#
# Hyprland wants rgb()/rgba() with a bare RRGGBB, hence `hex_stripped`.

# Material roles
$velaBackground             = rgb({{colors.background.default.hex_stripped}})
$velaOnBackground           = rgb({{colors.on_background.default.hex_stripped}})
$velaSurface                = rgb({{colors.surface.default.hex_stripped}})
$velaOnSurface              = rgb({{colors.on_surface.default.hex_stripped}})
$velaOnSurfaceVariant       = rgb({{colors.on_surface_variant.default.hex_stripped}})
$velaSurfaceContainerLowest = rgb({{colors.surface_container_lowest.default.hex_stripped}})
$velaSurfaceContainerLow    = rgb({{colors.surface_container_low.default.hex_stripped}})
$velaSurfaceContainer       = rgb({{colors.surface_container.default.hex_stripped}})
$velaSurfaceContainerHigh   = rgb({{colors.surface_container_high.default.hex_stripped}})
$velaPrimary                = rgb({{colors.primary.default.hex_stripped}})
$velaOnPrimary              = rgb({{colors.on_primary.default.hex_stripped}})
$velaPrimaryContainer       = rgb({{colors.primary_container.default.hex_stripped}})
$velaSecondary              = rgb({{colors.secondary.default.hex_stripped}})
$velaTertiary               = rgb({{colors.tertiary.default.hex_stripped}})
$velaError                  = rgb({{colors.error.default.hex_stripped}})
$velaOutline                = rgb({{colors.outline.default.hex_stripped}})
$velaOutlineVariant         = rgb({{colors.outline_variant.default.hex_stripped}})

# Pre-composed with alpha. hyprlang substitutes variables textually and reads
# a name greedily, so `rgba($velaPrimarycc)` would look for a variable called
# "velaPrimarycc" -- anything needing alpha has to be baked in here.
$velaBorderActive   = rgba({{colors.primary.default.hex_stripped}}ff)
$velaBorderActiveB  = rgba({{colors.tertiary.default.hex_stripped}}ff)
$velaBorderInactive = rgba({{colors.outline_variant.default.hex_stripped}}55)
$velaBorderUrgent   = rgba({{colors.error.default.hex_stripped}}ff)
$velaShadowColour   = rgba({{colors.shadow.default.hex_stripped}}55)
$velaScrim          = rgba({{colors.scrim.default.hex_stripped}}cc)

# Solid background painted behind everything, so an empty workspace matches
# the palette instead of flashing grey.
$velaBackgroundSolid = rgba({{colors.background.default.hex_stripped}}ff)
