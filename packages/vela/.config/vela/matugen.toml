# vela's own matugen config, kept separate from ~/.config/matugen so it cannot
# collide with another rice's templates. This is the only matugen config vela
# has: the shell's wallpaper switcher and the `vela` CLI both retint through
# `vela retint`, which runs
#   matugen --config ~/.config/vela/matugen.toml image --source-color-index 0 <path>
# `--source-color-index 0` matters: without a terminal attached, matugen 4
# refuses to pick between several candidate source colours and exits. A
# matugen without the option gets none, and if it cannot choose either, vela
# gives it the image's dominant colour instead (`matugen color hex`).

[config]
version_check = false

# The shell's palette, both modes at once so it can flip light/dark itself.
# tokens/Colours.qml watches this file and recolours the running shell.
[templates.shell-scheme]
input_path = '~/.config/vela/templates/shell-scheme.json'
output_path = '~/.local/state/vela/scheme.json'

# The current mode's roles, plus which wallpaper and mode they came from.
# `vela colours` prints it, and `vela theme` reads the wallpaper back from it.
[templates.shell]
input_path = '~/.config/vela/templates/colours.json'
output_path = '~/.local/state/vela/colours.json'

# Everything below retints the rest of the desktop from the same wallpaper.
# Two notes on the output paths:
#
#   * ~/.config/hypr, ~/.config/kitty and ~/.config/fuzzel are real folders
#     with vela's files linked into them (bootstrap.sh, UNFOLDED), so these
#     land in your home, never in the repo. The first copy of each comes from
#     defaults/, so the configs are valid before a wallpaper is ever set.
#   * gtk.css has no include mechanism, so the GTK entries own the whole file.
#     If another rice also generates ~/.config/gtk-3.0/gtk.css, last writer
#     wins.

[templates.hyprland]
input_path = '~/.config/vela/templates/hypr-colours.lua'
output_path = '~/.config/hypr/conf/colours.lua'

# hyprlock is a separate hyprlang binary and cannot read the Lua config, so it
# keeps a variables-only .conf of its own.
[templates.hyprlock]
input_path = '~/.config/vela/templates/hypr-colours.conf'
output_path = '~/.config/hypr/colours.conf'

[templates.kitty]
input_path = '~/.config/vela/templates/kitty-colours.conf'
output_path = '~/.config/kitty/colours.conf'

[templates.fuzzel]
input_path = '~/.config/vela/templates/fuzzel-colours.ini'
output_path = '~/.config/fuzzel/colours.ini'

[templates.gtk3]
input_path = '~/.config/vela/templates/gtk3.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/vela/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# The terminal greeting (`vela greet`) and plain `fastfetch`. fastfetch has no
# include either, so like GTK this owns the whole file.
[templates.fastfetch]
input_path = '~/.config/vela/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

# cava in a terminal -- not the shell's own waveform, which has its own config.
# Owns the whole file for the same reason. `vela retint` sends a running cava
# SIGUSR2, which reloads its colours in place.
[templates.cava]
input_path = '~/.config/vela/templates/cava.ini'
output_path = '~/.config/cava/config'
