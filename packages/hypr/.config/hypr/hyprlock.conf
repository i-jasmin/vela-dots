# hyprlock -- fallback lock screen
#
# vela has its own lock screen (a Quickshell WlSessionLock, bound to SUPER+L
# and called from hypridle). This file is the backstop for when the shell is
# not running: a crashed or restarting Quickshell must never mean an unlocked
# laptop. hypridle falls through to `hyprlock` when the IPC call fails.
#
# Deliberately plain -- no blur passes, no widgets to go wrong. It has one job.
#
# Colours come from the same matugen-generated file the compositor uses, so
# the fallback still matches the wallpaper.

source = ~/.config/hypr/colours.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # There is no grace period option any more -- it moved to the command
    # line (`hyprlock --grace N`). Nothing here passes one, which is what we
    # want: if this is on screen, something already decided to lock.
}

background {
    monitor =
    color = $velaBackground
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $velaOnSurface
    font_size = 88
    font_family = Rubik Light
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $velaOnSurfaceVariant
    font_size = 18
    font_family = Rubik
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    rounding = 26

    outer_color = $velaOutlineVariant
    inner_color = $velaSurfaceContainer
    font_color = $velaOnSurface
    check_color = $velaPrimary
    fail_color = $velaError

    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -40
    halign = center
    valign = center
}

# Who is logging in, in case this is not the machine you thought it was.
label {
    monitor =
    text = $USER
    color = $velaOnSurfaceVariant
    font_size = 14
    font_family = Rubik
    position = 0, -100
    halign = center
    valign = center
}
