# vela -- starship
#
# Colours are ANSI names (blue, green, bright-black ...) rather than hex on
# purpose: the terminal's palette is generated from the wallpaper by matugen,
# so naming the slots makes the prompt retint along with everything else. A
# hardcoded hex prompt would be the one thing on screen that never changes.

add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[username]
show_always = false
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)[@](bright-black)"

[hostname]
ssh_only = true
style = "bold cyan"
format = "[$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
format = "[$path]($style)[$read_only](bold red) "

[git_branch]
symbol = " "
style = "bold magenta"
truncation_length = 24
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "$ "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

# Only appears once a command took long enough that you would wonder.
[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[ $duration]($style)"

[package]
disabled = true
